async function staff(){let ve=(await S.from('venues').select('*').eq('owner_id',p.id)).data||[],sh=(await S.from('shifts').select('*,venues(name),shift_requests(id,status,bartender_id,profiles:bartender_id(full_name,city,bartender_profiles(years_experience,reliability_score,verification_score)))').eq('created_by',p.id).order('starts_at',{ascending:false})).data||[];v.innerHTML=`<div class=row><h1>Staffing</h1><button class=btn id=post>Post shift</button></div>${!ve.length?`<div class=card><div class=eyebrow>LOCAL LAUNCH</div><h3>Don't see your bar?</h3><p class=muted>Claim one from the Home tab, or add a new venue below.</p></div><form id=vf class=card><h3>Add venue</h3><label>Name<input name=n required></label><label>City<input name=c required></label><label>State<input name=s value=NC></label><button class=btn>Create venue</button></form>`:''}<div class=stack>${sh.map(q=>`<div class=card><div class=row><div><b>${x(q.venues?.name||'Venue')}</b><p class=muted>${fmt(q.starts_at)} · $${Number(q.hourly_rate).toFixed(0)}/hr</p></div><span class=pill>${q.status}</span></div><h4>${q.shift_requests.length} applicants</h4>${q.shift_requests.map(r=>`<div class=row style="padding:9px 0;border-top:1px solid #eee"><div><b>${x(r.profiles?.full_name||'Bartender')}</b><p class=muted>${r.profiles?.bartender_profiles?.verification_score||0} BluePour · ${Number(r.profiles?.bartender_profiles?.reliability_score||100).toFixed(0)}% reliable</p></div>${r.status==='pending'&&q.status==='open'?`<button class="btn acc" data-id=${r.id}>Accept</button>`:`<span class=pill>${r.status}</span>`}</div>`).join('')}</div>`).join('')||'<div class=empty>No shifts yet.</div>'}</div><dialog id=d></dialog>`;if(window.vf)vf.onsubmit=async e=>{e.preventDefault();let f=new FormData(vf),r=await S.from('venues').insert({owner_id:p.id,name:f.get('n'),city:f.get('c'),state:f.get('s')});msg(r.error?r.error.message:'Venue created');staff()};post.onclick=()=>{if(!ve.length)return msg('Create a venue first');d.innerHTML=`<h2>Post shift</h2><form id=m><label>Venue<select name=v>${ve.map(z=>`<option value=${z.id}>${x(z.name)}</option>`)}</select></label><label>Start<input type=datetime-local name=a required></label><label>End<input type=datetime-local name=z required></label><label>Hourly rate<input type=number name=r value=25 required></label><button class=btn>Post</button></form>`;d.showModal();m.onsubmit=async e=>{e.preventDefault();let f=new FormData(m),r=await S.from('shifts').insert({venue_id:f.get('v'),created_by:p.id,starts_at:new Date(f.get('a')).toISOString(),ends_at:new Date(f.get('z')).toISOString(),hourly_rate:+f.get('r')});msg(r.error?r.error.message:'Shift posted');d.close();staff()}};document.querySelectorAll('.acc').forEach(z=>z.onclick=async()=>{let r=await S.rpc('accept_shift_request',{p_request_id:z.dataset.id});msg(r.error?r.error.message:'Bartender accepted — shift filled');staff()})}
async function talent(){let q=(await S.from('profiles').select('id,full_name,city,state,bartender_profiles(years_experience,hourly_rate,reliability_score,verification_score,profile_status)').eq('role','bartender')).data||[];q.sort((a,z)=>(z.bartender_profiles?.verification_score||0)-(a.bartender_profiles?.verification_score||0));v.innerHTML=`<div class=hero><div class=eyebrow>THE RAIL</div><h1>Local bartender talent.</h1><p class=muted>Built for managers who need to know who can actually handle the bar.</p></div><div class=stack>${q.map(z=>`<div class=card><div class=row><div class=avatar style="background:#0a84ff;color:white;width:54px;height:54px;border-radius:18px">${ini(z.full_name)}</div><div style="flex:1"><h3 style="margin:0 0 4px">${x(z.full_name||'Bartender')}</h3><p class=muted style="margin:0">${x(z.city||'Local')} ${x(z.state||'')} · ${z.bartender_profiles?.years_experience||0} yrs</p><div class=tagrow style="margin-top:8px"><span class=tag>$${Number(z.bartender_profiles?.hourly_rate||0).toFixed(0)}/hr</span><span class=tag>${Number(z.bartender_profiles?.reliability_score||100).toFixed(0)}% reliable</span><span class=tag>${z.bartender_profiles?.profile_status==='verified'?'✓ Verified':'Building profile'}</span></div></div><div style="text-align:center"><div class=score>${z.bartender_profiles?.verification_score||0}</div><small>BLUEPOUR</small></div></div></div>`).join('')||'<div class=empty>No bartenders yet.</div>'}</div>`}
